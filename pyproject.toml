[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-sim"
version = "0.2.0"
description = "Simulador de supervivencia y flujo de caja para negocios pequeños"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.0",
    "scipy>=1.18",
    "simpy>=4.1",
    "networkx>=3.7",
    "fastapi>=0.162",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "httpx>=0.28", "matplotlib>=3.11", "jupyter>=1.1", "ipykernel>=7.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
